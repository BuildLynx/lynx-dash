name: lynx-dash

services:
  lynx-dash:
    build:
      context: ../..
      dockerfile: Services/lynx-dash/Dockerfile
    container_name: lynx-dash-app
    ports:
      - "8080:8080"
    volumes:
      - ./default-layout.json:/lichtblick/default-layout.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
